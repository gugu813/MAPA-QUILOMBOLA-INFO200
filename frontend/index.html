<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa de Memórias Quilombolas</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { display: flex; height: 100vh; }
        #sidebar { width: 340px; padding: 20px; background: #f8f9fa; border-right: 1px solid #ddd; overflow-y: auto; }
        #map { flex-grow: 1; }
        form input, form textarea { width: 100%; margin-bottom: 10px; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; padding: 10px; background: #27ae60; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .info-card { background: white; padding: 15px; border-radius: 6px; border: 1px solid #eee; margin-top: 15px; }
    </style>
</head>
<body>
    <div id="sidebar">
        <h2>Cadastrar Memória</h2>
        <form id="form-comunidade" style="margin-top: 15px;">
            <input type="text" id="nome" placeholder="Nome da Comunidade" required>
            <textarea id="historia" placeholder="Resumo / História" rows="3" required></textarea>
            <input type="number" step="any" id="latitude" placeholder="Latitude (ex: -2.3853)" required>
            <input type="number" step="any" id="longitude" placeholder="Longitude (ex: -44.4144)" required>
            <input type="text" id="situacao" placeholder="Situação (ex: Certificado)" required>
            <button type="submit">Salvar no Mapa</button>
        </form>
        <hr style="margin: 20px 0;">
        <div id="info-panel" class="info-card">
            <p><i>Clique em um marcador no mapa para ver as informações.</i></p>
        </div>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>
</body>
</html>
