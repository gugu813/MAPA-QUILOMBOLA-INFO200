<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa de Memórias Quilombolas</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        html, body { width: 100%; height: 100%; overflow: hidden; }
        body { display: flex; background-color: #f4f6f9; }

        /* Painel Lateral */
        #sidebar { 
            width: 390px; 
            height: 100vh; 
            background: #ffffff; 
            border-right: 1px solid #e0e0e0; 
            display: flex; 
            flex-direction: column; 
            box-shadow: 2px 0 10px rgba(0,0,0,0.08);
            z-index: 1000;
        }

        .sidebar-header { padding: 18px 20px; background: #1b4332; color: white; }
        .sidebar-header h2 { font-size: 1.25rem; font-weight: 600; display: flex; align-items: center; gap: 8px; }
        .sidebar-header p { font-size: 0.8rem; opacity: 0.85; margin-top: 4px; }

        /* Navegação por Abas */
        .tab-menu { display: flex; background: #2d6a4f; }
        .tab-btn {
            flex: 1; padding: 11px 6px; border: none; background: transparent;
            color: #d8f3dc; font-size: 0.82rem; font-weight: 600; cursor: pointer; transition: all 0.2s;
        }
        .tab-btn.active { background: #ffffff; color: #1b4332; border-bottom: 3px solid #52b788; }
        .tab-content { flex: 1; padding: 18px; overflow-y: auto; display: none; }
        .tab-content.active { display: block; }

        /* Inputs e Botões */
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 0.78rem; font-weight: 700; color: #333; margin-bottom: 4px; }
        input, textarea, select { 
            width: 100%; padding: 9px; border: 1px solid #ced4da; border-radius: 6px; font-size: 0.88rem; outline: none;
        }
        input:focus, textarea:focus { border-color: #2d6a4f; box-shadow: 0 0 0 2px rgba(45,106,79,0.15); }

        .btn { 
            width: 100%; padding: 10px; background: #2d6a4f; color: white; border: none; 
            border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.88rem;
        }
        .btn:hover { background: #1b4332; }
        .btn-search { background: #1d3557; margin-top: 6px; }
        .btn-search:hover { background: #0d1b2a; }

        /* Cards da Lista */
        .community-card {
            background: #f8f9fa; border: 1px solid #e9ecef; border-left: 5px solid #2d6a4f;
            border-radius: 6px; padding: 12px; margin-bottom: 10px; cursor: pointer; transition: all 0.15s ease-in-out;
        }
        .community-card:hover { transform: translateX(3px); box-shadow: 0 4px 10px rgba(0,0,0,0.06); background: #ffffff; }
        .community-card h4 { color: #1b4332; font-size: 0.92rem; }
        .community-card p { font-size: 0.78rem; color: #555; margin-top: 4px; line-height: 1.35; word-wrap: break-word; }
        .community-card .badge {
            display: inline-block; padding: 2px 8px; background: #d8f3dc; color: #1b4332;
            font-size: 0.72rem; border-radius: 10px; margin-top: 8px; font-weight: 700;
        }

        #map { flex: 1; height: 100vh; background-color: #e5e3df; }

        .tip-box { background: #e8f5e9; border-left: 4px solid #2e7d32; color: #1b5e20; padding: 10px; border-radius: 4px; font-size: 0.78rem; margin-bottom: 12px; }

        /* Pin Leaflet Customizado */
        .custom-pin {
            background-color: #e63946; width: 18px; height: 18px; border-radius: 50% 50% 50% 0;
            transform: rotate(-45deg); border: 2px solid #ffffff; box-shadow: 0 2px 5px rgba(0,0,0,0.4);
        }
        .custom-pin::after {
            content: ''; width: 6px; height: 6px; margin: 4px 0 0 4px; background: #ffffff; position: absolute; border-radius: 50%;
        }

        .btn-gmaps {
            display: inline-block; margin-top: 8px; padding: 6px 10px; background-color: #4285F4;
            color: #fff !important; text-decoration: none; border-radius: 4px; font-size: 0.75rem; font-weight: bold;
        }
        .btn-gmaps:hover { background-color: #2b6cb0; }
    </style>
</head>
<body>

    <div id="sidebar">
        <div class="sidebar-header">
            <h2>📍 Memórias Quilombolas</h2>
            <p>Mapeamento e Salvaguarda Territorial</p>
        </div>

        <div class="tab-menu">
            <button class="tab-btn active" onclick="switchTab('tab-busca', event)">🔍 Buscar</button>
            <button class="tab-btn" onclick="switchTab('tab-cadastrar', event)">➕ Cadastrar</button>
            <button class="tab-btn" onclick="switchTab('tab-stats', event)">📊 Estatísticas</button>
        </div>

        <!-- ABA 1: BUSCAR E LISTAR -->
        <div id="tab-busca" class="tab-content active">
            <div class="form-group">
                <label>Procurar Comunidade ou Município</label>
                <input type="text" id="filtro-pesquisa" placeholder="Ex: Filipa, Alcântara, Mirinzal...">
            </div>
            <button type="button" id="btn-buscar-geo" class="btn btn-search">🌐 Buscar no GPS / Mapa</button>
            <hr style="margin: 15px 0; border: 0; border-top: 1px solid #eee;">
            <label style="display:block; font-size: 0.82rem; font-weight: bold; margin-bottom: 10px; color: #495057;">
                Comunidades Encontradas (<span id="total-count">0</span>)
            </label>
            <div id="lista-comunidades"></div>
        </div>

        <!-- ABA 2: CADASTRO -->
        <div id="tab-cadastrar" class="tab-content">
            <div class="tip-box">
                👉 <b>Dica:</b> Clique direto em qualquer local do mapa para preencher a Latitude e Longitude automaticamente!
            </div>
            <form id="form-comunidade">
                <div class="form-group">
                    <label>Nome da Comunidade</label>
                    <input type="text" id="nome" placeholder="Ex: Povoado Quilombola Filipa" required>
                </div>
                <div class="form-group">
                    <label>História / Resumo</label>
                    <textarea id="historia" rows="3" placeholder="Resumo histórico e tradições..." required></textarea>
                </div>
                <div class="form-group">
                    <label>Latitude Exata</label>
                    <input type="number" step="any" id="latitude" required>
                </div>
                <div class="form-group">
                    <label>Longitude Exata</label>
                    <input type="number" step="any" id="longitude" required>
                </div>
                <div class="form-group">
                    <label>Situação Fundiária / Palmares</label>
                    <select id="situacao" required>
                        <option value="Certificada">Certificada (Fundação Palmares)</option>
                        <option value="Titulada">Titulada (INCRA/ITERMA)</option>
                        <option value="Em Processo">Em Processo de Regularização</option>
                    </select>
                </div>
                <button type="submit" class="btn">Salvar Comunidade</button>
            </form>
        </div>

        <!-- ABA 3: ESTATÍSTICAS -->
        <div id="tab-stats" class="tab-content">
            <h3 style="font-size: 0.95rem; color: #1b4332; margin-bottom: 12px;">Resumo do Banco de Dados</h3>
            <div class="community-card" style="border-left-color: #1d3557;">
                <h4>Total Mapeado</h4>
                <p style="font-size: 1.4rem; font-weight: bold; color: #1d3557;" id="stat-total">0</p>
            </div>
            <div class="community-card" style="border-left-color: #2d6a4f;">
                <h4>Situação Fundiária</h4>
                <div id="stat-situacoes" style="font-size: 0.82rem; margin-top: 6px; color: #444;"></div>
            </div>
        </div>
    </div>

    <!-- Container do Mapa -->
    <div id="map"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
    <script>
        // BASE DE DADOS COMPLETA COM COORDENADAS RURAIS EXATAS
        const COMUNIDADES_REAIS = [
            {
                id: 1,
                nome: "Povoado Quilombola Filipa",
                historia: "Comunidade secular em Itapecuru-Mirim (MA). Marcada pela preservação cultural e identidade tradicional reconhecida.",
                latitude: -3.326111,
                longitude: -44.358611,
                situacao_palmares: "Certificada"
            },
            {
                id: 2,
                nome: "UEB São Sebastião (Povoado Filipa)",
                historia: "Unidade de Ensino Básico localizada no Povoado Quilombola Filipa, garantindo a educação escolar no território.",
                latitude: -3.326486,
                longitude: -44.358807,
                situacao_palmares: "Certificada"
            },
            {
                id: 3,
                nome: "Quilombo Outeiro dos Nogueiras",
                historia: "Comunidade quilombola tradicional certificada pela Fundação Cultural Palmares em Itapecuru-Mirim.",
                latitude: -3.456000, 
                longitude: -44.295000,
                situacao_palmares: "Certificada"
            },
            {
                id: 4,
                nome: "Quilombo Santa Rosa dos Pretos",
                historia: "Comunidade secular em Itapecuru-Mirim (MA). Localizada na zona rural às margens da BR-135, com forte resistência territorial.",
                latitude: -3.535800, 
                longitude: -44.408100,
                situacao_palmares: "Certificada"
            },
            {
                id: 5,
                nome: "Quilombo Itamatatiua",
                historia: "Localizado em Alcântara (MA). Reconhecido nacionalmente pelo trabalho artesanal secular das mulheres louceiras.",
                latitude: -2.385300,
                longitude: -44.414400,
                situacao_palmares: "Titulada"
            },
            {
                id: 6,
                nome: "Quilombo Frechal",
                historia: "Situado em Mirinzal (MA). Primeira comunidade quilombola da América Latina a ter terras oficialmente desapropriadas.",
                latitude: -2.066700,
                longitude: -44.783300,
                situacao_palmares: "Titulada"
            }
        ];

        const map = L.map('map').setView([-2.8000, -44.4000], 8);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);

        const redPinIcon = L.divIcon({
            className: 'custom-pin-wrapper',
            html: `<div class="custom-pin"></div>`,
            iconSize: [20, 20],
            iconAnchor: [10, 20],
            popupAnchor: [0, -20]
        });

        let markersLayer = L.layerGroup().addTo(map);
        let dadosComunidades = [];

        function switchTab(tabId, event) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById(tabId).classList.add('active');
        }

        map.on('click', (e) => {
            const { lat, lng } = e.latlng;
            document.getElementById('latitude').value = lat.toFixed(6);
            document.getElementById('longitude').value = lng.toFixed(6);
            document.querySelectorAll('.tab-btn')[1].click();
        });

        function carregarComunidades() {
            // Chave v3 garante limpeza de dados incorretos da memória do navegador
            const backup = localStorage.getItem('quilombos_v3'); 
            dadosComunidades = backup ? JSON.parse(backup) : COMUNIDADES_REAIS;
            
            localStorage.setItem('quilombos_v3', JSON.stringify(dadosComunidades));
            renderizarPainel(dadosComunidades, true);
        }

        function renderizarPainel(lista, ajustarVisaoGeral = false) {
            markersLayer.clearLayers();
            const listaEl = document.getElementById('lista-comunidades');
            listaEl.innerHTML = '';

            document.getElementById('total-count').textContent = lista.length;
            document.getElementById('stat-total').textContent = dadosComunidades.length;

            if (lista.length === 0) {
                listaEl.innerHTML = `<p style="font-size: 0.85rem; color: #777; margin-top: 10px;">Nenhuma comunidade encontrada.</p>`;
                return;
            }

            const contagemSituacao = {};
            const bounds = L.latLngBounds();

            lista.forEach(c => {
                const gmapsUrl = `https://www.google.com/maps?q=${c.latitude},${c.longitude}`;
                const marker = L.marker([c.latitude, c.longitude], { icon: redPinIcon });
                
                marker.bindPopup(`
                    <div style="font-family: sans-serif; max-width: 220px;">
                        <h3 style="color:#1b4332; margin-bottom:4px; font-size: 0.95rem;">${c.nome}</h3>
                        <p style="font-size:0.8rem; color:#555;"><b>Status:</b> ${c.situacao_palmares}</p>
                        <p style="font-size:0.75rem; color:#888;">Lat: ${c.latitude} | Lng: ${c.longitude}</p>
                        <hr style="margin:6px 0; border:0; border-top:1px solid #eee;">
                        <p style="font-size:0.82rem; line-height:1.3; color:#333;">${c.historia}</p>
                        <a href="${gmapsUrl}" target="_blank" class="btn-gmaps">🗺️ Abrir no Google Maps</a>
                    </div>
                `);
                
                markersLayer.addLayer(marker);
                bounds.extend([c.latitude, c.longitude]);

                const card = document.createElement('div');
                card.className = 'community-card';
                card.innerHTML = `
                    <h4>${c.nome}</h4>
                    <p>${c.historia}</p>
                    <span class="badge">${c.situacao_palmares}</span>
                `;
                
                card.onclick = () => {
                    map.setView([c.latitude, c.longitude], 15, { animate: true });
                    marker.openPopup();
                };

                listaEl.appendChild(card);
                contagemSituacao[c.situacao_palmares] = (contagemSituacao[c.situacao_palmares] || 0) + 1;
            });

            // Enquadra o zoom automaticamente para exibir TODOS os pinos cadastrados/filtrados
            if (bounds.isValid() && (ajustarVisaoGeral || lista.length > 1)) {
                map.fitBounds(bounds, { padding: [40, 40] });
            }

            const statBox = document.getElementById('stat-situacoes');
            statBox.innerHTML = Object.entries(contagemSituacao)
                .map(([sit, count]) => `<div style="margin-bottom:3px;">• <b>${sit}:</b> ${count}</div>`)
                .join('');
        }

        document.getElementById('filtro-pesquisa').addEventListener('input', (e) => {
            const termo = e.target.value.toLowerCase().trim();
            const resultado = dadosComunidades.filter(c => 
                c.nome.toLowerCase().includes(termo) ||
                c.historia.toLowerCase().includes(termo) ||
                c.situacao_palmares.toLowerCase().includes(termo)
            );
            renderizarPainel(resultado, false);
        });

        document.getElementById('btn-buscar-geo').addEventListener('click', async () => {
            const query = document.getElementById('filtro-pesquisa').value.trim();
            if (!query) return alert('Digite uma comunidade ou município para buscar!');

            const encontradaLocal = dadosComunidades.find(c => c.nome.toLowerCase().includes(query.toLowerCase()));
            if (encontradaLocal) {
                map.setView([encontradaLocal.latitude, encontradaLocal.longitude], 14);
                return;
            }

            try {
                let res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query + ', Maranhão')}`);
                let data = await res.json();

                if (data.length > 0) {
                    const lat = parseFloat(data[0].lat);
                    const lon = parseFloat(data[0].lon);

                    map.setView([lat, lon], 12);
                    document.getElementById('latitude').value = lat.toFixed(6);
                    document.getElementById('longitude').value = lon.toFixed(6);
                } else {
                    alert('Localização não encontrada. Clique no mapa para marcar manualmente!');
                }
            } catch (err) {
                alert('Erro de conexão ao buscar no GPS.');
            }
        });

        document.getElementById('form-comunidade').addEventListener('submit', (e) => {
            e.preventDefault();
            
            const nova = {
                id: Date.now(),
                nome: document.getElementById('nome').value,
                historia: document.getElementById('historia').value,
                latitude: parseFloat(document.getElementById('latitude').value),
                longitude: parseFloat(document.getElementById('longitude').value),
                situacao_palmares: document.getElementById('situacao').value
            };

            dadosComunidades.unshift(nova);
            localStorage.setItem('quilombos_v3', JSON.stringify(dadosComunidades));

            document.getElementById('form-comunidade').reset();
            renderizarPainel(dadosComunidades, false);

            map.setView([nova.latitude, nova.longitude], 14);
            document.querySelectorAll('.tab-btn')[0].click();
        });

        carregarComunidades();
    </script>
</body>
</html>
